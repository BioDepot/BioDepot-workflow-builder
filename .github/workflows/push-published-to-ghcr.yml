name: Push Published Docker images
on:
  release:
    types: published
permissions:
  contents: read
  packages: write
jobs:
  push_to_registry:
    name: Push Docker image to GitHub Container Registry
    runs-on: ubuntu-latest
    steps:
      - name: Set lowercase owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >>${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'
      - name: Check out the repo
        uses: actions/checkout@v2
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build standard image for testing
        uses: docker/build-push-action@v2
        with:
          load: true
          tags: ghcr.io/${{ env.OWNER_LC }}/bwb:${{ github.event.release.tag_name }}
      - name: Test the web runtime before publishing
        env:
          BWB_IMAGE: ghcr.io/${{ env.OWNER_LC }}/bwb:${{ github.event.release.tag_name }}
        run: python3 tests/smoke_web.py "$BWB_IMAGE"
      - name: Push tested image to GitHub Container Registry
        env:
          BWB_IMAGE: ghcr.io/${{ env.OWNER_LC }}/bwb:${{ github.event.release.tag_name }}
        run: docker push "$BWB_IMAGE"
