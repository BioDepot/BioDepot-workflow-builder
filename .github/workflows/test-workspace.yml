name: Shared workspace regressions
on:
  push:
    paths:
      - 'coreutils/DockerClient.py'
      - 'coreutils/BwbStartup.py'
      - 'coreutils/BwBase.py'
      - 'VM/coreutils/DockerClient.py'
      - 'VM/coreutils/BwbStartup.py'
      - 'VM/coreutils/BwBase.py'
      - 'scripts/runDockerJob.sh'
      - 'scripts/startBwb.sh'
      - 'scripts/startSingleBwb.sh'
      - 'startup.sh'
      - 'orangePatches/__main__.py'
      - 'VM/orange3/Orange/canvas/__main__.py'
      - 'VM/startBwb.sh'
      - 'Dockerfile.workspace-fix'
      - 'Dockerfile'
      - 'tests/**'
      - '.github/workflows/test-workspace.yml'
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test as non-root, including actual permission failures
        run: |
          command -v jq
          python3 -m unittest discover -s tests -v
          bash -n scripts/runDockerJob.sh scripts/startBwb.sh scripts/startSingleBwb.sh startup.sh VM/startBwb.sh
          git diff --check
